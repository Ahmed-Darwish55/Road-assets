<style>
/* Layout idea: charts on top, then a tree that flows downward level by level; clicking a card opens its children underneath it. */
:root{
  color-scheme:light;
  /* RGA brand: green 4D7F71, gray 76777A, gold B99C16; secondary blue 4E738A, brown A39383, red A8483D */
  --page:#f1f2f1; --surface:#ffffff; --field:#f4f6f5; --hover:#e4ebe8; --line:#c8c9ca; --line-strong:#9fa0a2;
  --text:#27312e; --text2:#4a5552; --muted:#76777A; --primary:#4D7F71; --primary-deep:#3b6659; --on-primary:#ffffff; --gold:#B99C16;
  --shadow:0 2px 5px -1px rgba(39,49,46,.16); --shadow-up:0 8px 18px -6px rgba(39,49,46,.3);
  --ring:linear-gradient(135deg,#B99C16 0%,#4D7F71 100%); --knob:#ffffff; --knob-ink:#3b6659;
  --b-pav:#4E738A; --b-str:#A8483D; --b-oth:#B99C16; --b-net:#4D7F71; --b-all:#76777A; --hit:#f1e7b4; --road:#76777A;
  --font:"Cairo","Segoe UI",Tahoma,sans-serif; --dots:rgba(118,119,122,.22); --mono:"Cairo","Segoe UI",sans-serif;
  --spring:cubic-bezier(.34,1.4,.64,1);
}
html[data-mode="dark"]{
  color-scheme:dark;
  --page:#1a201e; --surface:#262e2b; --field:#1f2624; --hover:#34403c; --line:#48534f; --line-strong:#76777A;
  --text:#f3f5f4; --text2:#d3d8d6; --muted:#a3a8a6; --primary:#4D7F71; --primary-deep:#3b6659; --on-primary:#ffffff; --gold:#d2b53a;
  --shadow:0 2px 5px -1px rgba(0,0,0,.5); --shadow-up:0 10px 22px -8px rgba(0,0,0,.7);
  --ring:linear-gradient(135deg,#d2b53a 0%,#74ad9b 100%); --knob:#ffffff; --knob-ink:#3b6659;
  --b-pav:#8fb4cc; --b-str:#e08c81; --b-oth:#e3c64a; --b-net:#86c2af; --b-all:#c9cecb; --hit:#5c5220; --road:#8d8f92; --dots:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7}
.wrap{max-width:1440px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 60px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.top{position:relative;overflow:hidden;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px;background:var(--primary);color:#fff;border-radius:18px;padding:22px 26px;--field:rgba(255,255,255,.16);--muted:rgba(255,255,255,.85);--ring:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.6))}
.top::before{content:"";position:absolute;inset-block:-20px;inset-inline-end:150px;width:230px;background:repeating-linear-gradient(90deg,var(--gold) 0 34px,transparent 34px 62px);transform:skewX(-38deg);opacity:.95}
html[dir="rtl"] .top::before{transform:skewX(38deg)}
.top>*{position:relative;z-index:1}
.top>div:first-child{flex:1 1 420px;min-width:0}
h1{font-weight:800;font-size:clamp(22px,2.6vw,30px);line-height:1.35;margin:0 0 4px;text-wrap:balance}
.top p{margin:0;max-width:64ch;color:rgba(255,255,255,.9);font-size:14.5px}
p{margin:0}
.tools{display:flex;gap:12px;align-items:center;background:var(--primary-deep);padding:6px;border-radius:999px}
.pill{position:relative;display:inline-flex;padding:3px;gap:2px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:transparent;flex:none}
.pill .knob{position:absolute;top:3px;inset-inline-start:3px;height:34px;border-radius:999px;background:var(--knob);box-shadow:0 4px 10px -4px rgba(0,0,0,.5);transition:inset-inline-start .55s var(--spring),width .55s var(--spring)}
.pill button{position:relative;z-index:1;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:999px;background:transparent;color:#fff;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;transition:color .25s ease}
.pill button[aria-pressed="true"]{color:var(--knob-ink)}
.theme button{width:34px}.theme .knob{width:34px}.theme svg{width:17px;height:17px}
.theme.is-dark .knob{inset-inline-start:calc(3px + 34px + 2px)}
.lang button{width:76px}.lang .knob{width:76px}
.lang.is-ar .knob{inset-inline-start:calc(3px + 76px + 2px)}
html::view-transition-old(root),html::view-transition-new(root){animation:none!important;opacity:1!important;mix-blend-mode:normal!important}
html::view-transition-image-pair(root){isolation:auto!important}
html[data-shrinking]::view-transition-old(root){z-index:2}
html[data-shrinking]::view-transition-new(root){z-index:1}
/* charts */
.charts{display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:16px;margin-bottom:28px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.col .ch-a{flex:1}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.ch{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--primary);border-radius:14px;padding:18px 20px 20px;min-width:0;box-shadow:var(--shadow)}
.ch h2{font-weight:800;font-size:15.5px;margin:0 0 14px;color:var(--text)}
.ch h2 span{font-size:11.5px;font-weight:600;color:var(--muted);margin-inline-start:8px;direction:ltr;unicode-bidi:isolate}
.ch-a{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;align-items:center;gap:6px 26px}
.ch-a h2{grid-column:1/-1;margin-bottom:4px}
.ch-a .lg{flex-direction:column;gap:12px;margin-top:0;font-size:14px}
.ch-b{display:flex;flex-direction:column;gap:26px}
.ch-b .split{height:38px}
.ch-b .lg{font-size:13.5px;margin-top:14px}
.ch-c{display:flex;flex-direction:column}
.ch-c .fb{flex:1;align-content:space-between}
#ring{width:176px;height:176px}
#ring circle{fill:none;stroke-width:14;transform:rotate(-90deg);transform-origin:70px 70px;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
#ring .big{font-weight:700;font-size:30px;fill:var(--text);text-anchor:middle}
#ring .sm{font-size:11.5px;fill:var(--muted);text-anchor:middle}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text2);margin-top:12px}
.lg span{display:inline-flex;align-items:center;gap:7px}
.lg b{color:var(--text);font-variant-numeric:tabular-nums}
.lg .hint{color:var(--muted);margin-inline-start:auto}
.sw{width:12px;height:12px;border-radius:4px;background:var(--k,var(--primary));display:inline-block;flex:none}
.sw.lt{opacity:.38}
.split{display:flex;gap:3px;height:28px}
.split div{height:100%;background:var(--k);border-radius:6px;min-width:8px;flex-grow:0;transition:flex-grow 1.1s cubic-bezier(.2,.8,.2,1)}
.fb{display:grid;gap:4px;margin-top:12px}
.fr{display:grid;grid-template-columns:minmax(140px,236px) 1fr;gap:16px;align-items:center;font:inherit;font-size:13.5px;color:var(--text);background:transparent;border:0;border-radius:10px;padding:3px 8px;cursor:pointer;text-align:start;width:100%}
.fr:hover{background:var(--hover)}
.fr .nm{min-width:0;line-height:1.4;font-weight:500}
.fr .nm small{display:block;font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .tr{display:flex;gap:2px;height:16px;align-items:center}
.fr .tr i{display:block;height:100%;background:var(--k);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d)}
.fr .tr i.m{border-start-start-radius:5px;border-end-start-radius:5px}
.fr .tr i.c{opacity:.38;border-start-end-radius:5px;border-end-end-radius:5px}
.fr .tr i.solo{border-radius:5px}
.fr .v{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);margin-inline-start:8px;flex:none}
/* tree */
.b-pav{--k:var(--b-pav)} .b-str{--k:var(--b-str)} .b-oth{--k:var(--b-oth)} .b-net{--k:var(--b-net)} .b-all{--k:var(--b-all)}
.treecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px clamp(12px,2vw,22px) 8px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--k);display:inline-block;flex:none}
i.dash{width:22px;height:12px;border:1.8px dashed var(--muted);border-radius:4px;display:inline-block}
.find{position:relative;flex:0 1 340px;min-width:200px}
.find input{width:100%;font:inherit;font-size:14.5px;padding:8px 14px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field);color:var(--text)}
.find input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
.find input::placeholder{color:var(--muted)}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-up);padding:6px;display:grid;gap:2px;max-height:320px;overflow:auto}
.results[hidden]{display:none}
.results button{font:inherit;font-size:13.5px;text-align:start;border:0;background:transparent;color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.results button:hover{background:var(--hover)}
.results small{color:var(--muted);font-size:11.5px}
.results .none{padding:8px 10px;font-size:13.5px;color:var(--muted)}
.treecard{position:relative;padding:0;overflow:visible}
.bar{padding:14px 20px;margin:0}
.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;border-radius:0 0 15px 15px;background-image:radial-gradient(var(--dots) 1.2px,transparent 1.4px);background-size:24px 24px}
.scroll::-webkit-scrollbar{display:none}
.scroll.drag{cursor:grabbing}
.scroll.drag .node{pointer-events:none}
.zoom{position:sticky;bottom:16px;z-index:7;width:max-content;margin:-60px 16px 16px auto;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line-strong);box-shadow:var(--shadow-up)}
.zoom button{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;font:inherit;transition:background .2s ease}
.zoom button:hover{background:var(--hover)}
#fs .b,#fs[aria-pressed="true"] .a{display:none}#fs[aria-pressed="true"] .b{display:inline}
.treecard.fs{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;border-radius:0;border:0;margin:0;width:auto;height:auto;max-width:none}
.treecard.fs .scroll{flex:1 1 auto;min-height:0;overflow:auto;border-radius:0;overscroll-behavior:contain}
.treecard.fs .zoom{position:fixed;bottom:18px;inset-inline-end:18px;margin:0}
html.fs-on,html.fs-on body{overflow:hidden}
html.turn,html.turn body{overflow-x:clip}
.scroll{touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.node,.allbtn,.zoom button,.fr{touch-action:manipulation}
@media (pointer:coarse){.zoom button{width:42px;height:42px}.zoom button svg{width:19px;height:19px}.find input{font-size:16px}.allbtn{padding:10px 16px}.pop button{font-size:22px;padding:6px 10px}}
@media (max-width:640px){.wrap{padding:14px 10px 40px}.bar{padding:12px 14px}.bar .acts{flex:1 1 100%}.bar .acts .find{flex:1 1 100%}.bar .allbtn{flex:1 1 100%;justify-content:center}#tree{padding:22px 16px 90px;padding-inline-end:310px;gap:140px}.pop{width:256px}.treecard.fs .bar .legend{display:none}}
html.turn .wrap,html.turn .treecard.fs{will-change:transform;backface-visibility:hidden}
.zoom button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zoom output{min-width:46px;text-align:center;font-size:12.5px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
#tree{position:relative;isolation:isolate;display:flex;align-items:flex-start;gap:150px;padding:30px 26px 90px;padding-inline-end:340px;min-width:max-content;min-height:440px}
#wires{position:absolute;left:0;right:auto;top:0;z-index:-1;overflow:visible;pointer-events:none;direction:ltr}
.level{display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:none}
.node{position:relative;isolation:isolate;display:inline-flex;flex-wrap:wrap;align-items:center;gap:1px 9px;width:max-content;max-width:296px;text-align:start;font:inherit;color:var(--text);background:none;border:0;padding:7px 13px 8px 9px;cursor:pointer;transition:color .35s ease;-webkit-tap-highlight-color:transparent;will-change:transform}
.node:focus-visible{outline:none}
.node:focus-visible .edge{stroke:var(--k);stroke-width:3}
.shape{position:absolute;left:-16px;top:-16px;width:calc(100% + 32px);height:calc(100% + 32px);overflow:visible;z-index:-1;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(20,30,27,.2))}
.shape .bgp{fill:var(--surface)}
.shape .wat{fill:var(--k)}
.shape .edge{fill:none;stroke:var(--k);stroke-width:1.7;transition:stroke-width .2s ease}
.node:hover .shape{filter:drop-shadow(0 7px 9px rgba(20,30,27,.26))}
.node:hover .edge{stroke-width:2.4}
.node{translate:0 0;transition:color .35s ease,translate .22s ease}
@media (hover:hover){.node:hover{translate:0 -2px}}
.node .ic{transition:scale .22s ease}
@media (hover:hover){.node:hover .ic{scale:1.08}}
@media (prefers-reduced-motion:reduce){.node:hover{translate:0 0}.node:hover .ic{scale:1}}
.node.t-fam .bgp,.node.t-class .bgp,.node.t-group .bgp{fill:color-mix(in srgb,var(--k) 15%,var(--surface))}
.node.t-group .edge{stroke-dasharray:6 4}
.node .ic{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--k) 24%,var(--surface));color:var(--text);transition:background .35s ease,color .35s ease}
.node .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.node .tx{display:flex;flex-direction:column;min-width:0;flex:1 1 0%}
.node .nm{font-size:14px;font-weight:700;line-height:1.45}
.node .sec{font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.4;transition:color .35s ease}
.node .cnt{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--text);background:color-mix(in srgb,var(--k) 22%,var(--surface));border-radius:6px;padding:0 5px 0 7px;line-height:1.7;flex:none;font-variant-numeric:tabular-nums;transition:background .35s ease,color .35s ease}
.node .cnt svg{width:10px;height:10px}
html[dir="rtl"] .node .cnt svg{transform:scaleX(-1)}
html[dir="rtl"] .zoom{margin:-60px auto 16px 16px}
.node .rel{flex-basis:100%;display:none;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:4px;padding-top:4px;border-top:1.5px dashed currentColor}
.node .rel svg{width:13px;height:13px}
.rl{position:absolute;z-index:2;translate:-50% -50%;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11.5px;font-weight:800;line-height:1;padding:5px 9px 6px;border-radius:999px;background:var(--surface);color:var(--text);border:1.6px solid var(--k);box-shadow:0 1px 3px rgba(20,30,27,.18);pointer-events:none}
.rl svg{width:12px;height:12px;color:var(--k)}
html[dir="rtl"] .rl svg{transform:scaleX(-1)}
html[dir="rtl"] .node .rel svg{transform:scaleX(-1)}
.node.open .rel{display:flex}
.node.wet{color:#fff}
.node.wet .sec{color:rgba(255,255,255,.88)}
.node.wet .ic,.node.wet .cnt{background:rgba(255,255,255,.24);color:#fff}
.node.wet.b-oth{color:#231f05}.node.wet.b-oth .sec{color:rgba(35,31,5,.78)}.node.wet.b-oth .ic,.node.wet.b-oth .cnt{background:rgba(35,31,5,.14);color:#231f05}
html[data-mode="dark"] .node.wet{color:#141a18}html[data-mode="dark"] .node.wet .sec{color:rgba(20,26,24,.78)}html[data-mode="dark"] .node.wet .ic,html[data-mode="dark"] .node.wet .cnt{background:rgba(20,26,24,.16);color:#141a18}
.node.sel .edge{stroke-width:3.2}
.node.hit .bgp{fill:var(--hit)}
.node.t-root{cursor:default;padding:11px 17px 12px 13px;color:#fff}
.node.t-root .bgp{fill:var(--primary)}
.node.t-root .edge{stroke:var(--gold);stroke-width:2.6}
.node.t-root .ic{background:rgba(255,255,255,.22);color:#fff;width:36px;height:36px}
.node.t-root .nm{font-size:16.5px;font-weight:800}
.node.t-root .sec{color:rgba(255,255,255,.88)}
.node.t-root .rel{display:flex}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex:1 1 420px;justify-content:flex-end}
.acts .find{flex:0 1 320px}
.allbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:10px;border:1.5px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease}
.allbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.allbtn .a{display:none}
.allbtn:hover{background:color-mix(in srgb,var(--primary) 14%,transparent)}
.allbtn[aria-pressed="true"]{background:var(--primary);color:var(--surface)}
.allbtn[aria-pressed="true"] .a{display:inline}.allbtn[aria-pressed="true"] .b{display:none}
.allbtn:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:2px}
#tree.full{display:block;padding:0;min-width:0;min-height:0}
#tree.full>.node{position:absolute;margin:0}
#tree.full>.node:not(.leaf):not(.t-root){cursor:default}
.w{fill:none;stroke:var(--road);stroke-width:2.4;opacity:.8;stroke-linecap:round}
.w.act{stroke:var(--k);opacity:1;stroke-width:3.6}
.fl{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:butt;stroke-dasharray:7 9;opacity:0}
.fl.on{animation:run .7s linear infinite}
.fl.sub{stroke:var(--gold);stroke-width:2.2;animation:run 1s linear infinite}
@keyframes run{to{stroke-dashoffset:-16}}
.goo circle{fill:var(--k)}
.pop{position:absolute;width:280px;background:var(--surface);border:2px solid var(--k);border-radius:14px;padding:11px 15px 13px;box-shadow:var(--shadow-up);z-index:4}
.pop::before{content:"";position:absolute;top:var(--cy);inset-inline-start:-24px;width:22px;height:2.5px;background:var(--k)}
.pop b{display:block;font-weight:800;font-size:15px;line-height:1.45;padding-inline-end:22px}
.pop .sec{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pop p{margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--text2)}
.pop button{position:absolute;top:5px;inset-inline-end:7px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:3px 6px;border-radius:50%}
.pop button:hover{background:var(--hover)}
.pop .trail{margin-top:10px;padding-top:9px;border-top:1.5px dashed var(--line-strong)}
.pop .tl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pop ol{list-style:none;margin:0;padding:0}
.pop li{position:relative;padding-inline-start:20px;padding-bottom:7px;font-size:13px;line-height:1.45;color:var(--text2)}
.pop li small{display:block;font-size:11px;color:var(--muted)}
.pop li::before{content:"";position:absolute;inset-inline-start:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--k)}
.pop li::after{content:"";position:absolute;inset-inline-start:4px;top:17px;bottom:0;width:2px;background:var(--muted)}
.pop li i{position:absolute;inset-inline-start:1px;bottom:-1px;width:8px;height:8px;box-sizing:border-box;border:solid var(--muted);border-width:0 2px 2px 0;rotate:45deg}
.pop li:last-child{padding-bottom:0;font-weight:800;color:var(--text)}
.pop li:last-child::after{display:none}
@media (prefers-reduced-motion: reduce){.fl{animation:none}#ring circle,.split div,.fr .tr i,.pill .knob{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="t-h1"></h1><p id="t-intro"></p></div>
    <div class="tools">
      <div class="pill lang" id="lang" role="group" aria-label="Language"><span class="knob" aria-hidden="true"></span><button type="button" data-lang="en">English</button><button type="button" data-lang="ar">العربية</button></div>
      <div class="pill theme" id="theme" role="group"><span class="knob" aria-hidden="true"></span>
        <button type="button" data-mode="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button>
        <button type="button" data-mode="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="charts">
    <div class="col"><div class="ch ch-a"><h2 id="t-c1"></h2><svg id="ring" viewBox="0 0 140 140" role="img"></svg><div class="lg" id="ringlg"></div></div>
    <div class="ch ch-b"><div><h2 id="t-c2"></h2><div class="split" id="split"></div><div class="lg" id="splitlg"></div></div>
      <div><h2 id="t-c3"></h2><div class="split" id="grp"></div><div class="lg" id="grplg"></div></div></div></div>
    <div class="ch ch-c"><h2 id="t-c4"></h2><div class="lg" id="fblg" style="margin-top:0"></div><div class="fb" id="fbars"></div></div>
  </div>

<script>
const FAMS=[{"n":"Pavement","a":"الرصف","ch":[{"n":"Pavement Section","a":"مقطع الرصف","x":"جزء متجانس من رصف الطريق بطبقاته، وهو وحدة مسح الرصف وصيانته.","d":"Stretch of road pavement with a uniform structure and surface type, together with its structural layers.","ch":[{"n":"Pavement Joints","a":"فواصل الرصف الخرساني","x":"فاصل في الرصف الخرساني يضبط التشقق ويسمح بحركة البلاطات.","d":"Joint in a rigid (concrete) pavement that controls cracking and allows the concrete slabs to move."},{"n":"Pavement Layer","a":"طبقة الرصف","x":"طبقة واحدة من طبقات الرصف، بمادتها وسماكتها.","d":"One structural layer of a pavement section (wearing course, binder course, base, subbase or subgrade), with its material and thickness."}]}]},{"n":"Bridges & Tunnels & Culvert","a":"الجسور والأنفاق والعبّارات","ch":[{"n":"Bridge","a":"الجسر","x":"منشأة تحمل الطريق فوق عائق مثل وادٍ أو مجرى ماء أو طريق آخر.","d":"Structure that carries a road over an obstacle such as a valley, watercourse, road or railway, together with its structural components.","ch":[{"n":"Abutment","a":"الدعامة الطرفية","x":"الدعامة عند طرف الجسر، تحمله وتسند ردم المدخل.","d":"End support of a bridge that carries the superstructure and retains the approach embankment."},{"n":"Approach Slab","a":"بلاطة الاقتراب","x":"بلاطة عند نهاية الجسر تجعل الانتقال من الطريق إليه سلسًا.","d":"Reinforced slab at the end of a bridge that gives a smooth transition between the embankment and the bridge deck."},{"n":"Bearing Pad","a":"وسادة الحامل","x":"وسادة مطاطية في مسند الجسر تنقل الحمل وتسمح بحركة بسيطة.","d":"Elastomeric pad of a bridge bearing that transfers the load and allows small movements."},{"n":"Bridge Bearings","a":"مساند الجسر","x":"قطعة بين جسم الجسر ودعاماته تنقل الأحمال وتسمح بالحركة.","d":"Device between the superstructure and the supports of a bridge that transfers loads and allows movement and rotation."},{"n":"Bridge Deck","a":"سطح الجسر","x":"السطح الذي تسير عليه المركبات فوق الجسر.","d":"Riding surface and slab of a bridge that carries the traffic loads to the girders or supports."},{"n":"Bridge Drainage System","a":"نظام تصريف الجسر","x":"مجموعة تجمع ماء المطر من سطح الجسر وتصرفه.","d":"System that collects and removes rainwater from a bridge deck (scuppers, pipes and outlets).","ch":[{"n":"Bridge Scupper","a":"مصرف الجسر","x":"فتحة في سطح الجسر تصرف الماء عنه.","d":"Drain outlet in a bridge deck that removes surface water from the deck."}]},{"n":"Bridge Foundation","a":"أساس الجسر","x":"القاعدة التي تنقل أحمال الجسر إلى الأرض.","d":"Foundation of a bridge support (footing, piles or caissons) that transfers the loads to the ground."},{"n":"Bridge Girders","a":"الكمرات","x":"العوارض الطولية الرئيسية التي تحمل سطح الجسر.","d":"Main longitudinal beams of a bridge superstructure that carry the deck between the supports."},{"n":"Bridge Joint Seal","a":"مانع تسرب فاصل الجسر","x":"حشوة تمنع دخول الماء والأتربة إلى فاصل الجسر.","d":"Seal of a bridge expansion joint that keeps water and debris out of the joint."},{"n":"Bridge Parapet","a":"حاجز أو درابزين الجسر","x":"جدار أو حاجز على حافة الجسر يمنع سقوط المركبات والمشاة.","d":"Protective wall or barrier along the edge of a bridge deck that prevents vehicles and pedestrians from falling."},{"n":"Bridge Pile","a":"خازوق الجسر","x":"عمود مدفون ينقل أحمال الجسر إلى تربة أعمق وأقوى.","d":"Pile of a bridge foundation that transfers the loads to deeper, stronger ground."},{"n":"Bridge Span","a":"بحر الجسر","x":"جزء الجسر الواقع بين دعامتين.","d":"Part of a bridge between two supports, described by its length and material."},{"n":"Bridge Waterproofing","a":"طبقة عزل الجسر","x":"طبقة عازلة تحمي جسم الجسر من الماء.","d":"Waterproofing layer on the bridge deck that protects the structure from water and de-icing salts."},{"n":"Bridge Wing Wall","a":"جدار جناح الجسر","x":"جدار عند طرف الجسر يسند الردم من الجانبين.","d":"Wall at a bridge abutment that retains the embankment fill at the sides."},{"n":"Expansion Joints","a":"فواصل التمدد","x":"فاصل يسمح للجسر بالتمدد والانكماش مع الحرارة.","d":"Joint in a bridge deck that allows the structure to expand and contract with temperature while keeping a continuous riding surface."},{"n":"Inspection and Maintenance Access","a":"وسيلة وصول للفحص والصيانة","x":"سلالم وممرات ثابتة تمكّن المفتشين من الوصول لأجزاء الجسر.","d":"Fixed access provision on a bridge (for example ladders, walkways, hatches) that lets inspectors and maintenance crews reach its parts."},{"n":"Pier","a":"الركيزة","x":"دعامة وسطية تحمل الجسر بين طرفيه.","d":"Intermediate support of a bridge between the abutments that carries the superstructure to the foundation."},{"n":"Pile Cap","a":"قبعة الخوازيق","x":"كتلة خرسانية تربط رؤوس مجموعة خوازيق معًا.","d":"Concrete block that ties the heads of a group of piles together and transfers the loads of the support to them."},{"n":"Scour Protection","a":"حماية الركائز من النحر","x":"حماية حول دعامات الجسر في مجرى الماء تمنع جرف التربة.","d":"Protection (for example riprap or aprons) around bridge supports in a watercourse that prevents the erosion of the soil around the foundations."}]},{"n":"Culvert","a":"العبّارة","x":"منشأة تحت الطريق تمرر الماء من جانب إلى آخر.","d":"Structure under the road that lets water pass through, with openings of 3 m or less or a pipe of any diameter.","ch":[{"n":"Check Valve","a":"صمام عدم رجوع","x":"صمام يسمح بمرور الماء في اتجاه واحد فقط.","d":"Valve in a drainage line that lets water flow in one direction only."},{"n":"Culvert Apron","a":"فرشة أو بلاطة المخرج","x":"أرضية مرصوفة عند طرف العبّارة تحمي المجرى من الجرف.","d":"Paved floor at a culvert end that protects the channel from erosion."},{"n":"Culvert Headwall","a":"رأس العبارة","x":"جدار عند طرف العبّارة يسند الردم ويحمي فتحتها.","d":"Wall at the end of a culvert that retains the embankment and protects the culvert end."},{"n":"Culvert Inlet","a":"مدخل العبارة","x":"الطرف الذي يدخل منه الماء إلى العبّارة.","d":"Upstream end of a culvert where water enters it."},{"n":"Culvert Outlet","a":"مخرج العبارة","x":"الطرف الذي يخرج منه الماء من العبّارة.","d":"Downstream end of a culvert where water leaves it."},{"n":"Culvert Wingwall","a":"جدار جناح العبارة","x":"جدار جانبي يوجّه الماء ويسند الردم عند طرف العبّارة.","d":"Wall at a culvert end that guides the flow and retains the side embankment."},{"n":"Flap Gate","a":"بوابة رفرفة","x":"بوابة مفصلية تُخرج الماء وتمنع رجوعه.","d":"Hinged gate at a culvert or drain outlet that lets water out and prevents backflow."},{"n":"Trash Rack","a":"مانع مخلفات","x":"شبك يمنع المخلفات من دخول العبّارة وسدّها.","d":"Grid at a culvert or drain inlet that stops debris from entering and blocking it."}]},{"n":"Footbridge","a":"جسر مشاة","x":"جسر يعبر عليه المشاة فوق الطريق.","d":"Bridge for pedestrians that crosses over a road."},{"n":"Noise Barrier","a":"حاجز الضوضاء","x":"جدار على جانب الطريق يخفف ضوضاء المرور عن الجيران.","d":"Wall or screen along the road that reduces the traffic noise reaching nearby properties."},{"n":"Overpass","a":"جسر علوي","x":"جسر يحمل طريقًا فوق طريق آخر أو سكة حديد.","d":"Bridge that carries a road over another road or railway."},{"n":"Retaining Wall","a":"الجدار الساند","x":"جدار يسند التربة أو الصخر عند اختلاف منسوب الأرض.","d":"Wall that holds back soil or rock where the ground level changes along the road."},{"n":"Tunnel","a":"النفق","x":"منشأة مغلقة يمر الطريق داخلها عبر جبل أو تحت منطقة عمرانية.","d":"Underground or enclosed structure that carries the road through a hill, under a city area or under another obstacle, together with its civil components and safety systems.","ch":[{"n":"Emergency Doors","a":"أبواب طوارئ","x":"باب مقاوم للحريق عند مخرج طوارئ النفق.","d":"Fire-resistant door of a tunnel emergency exit or cross passage."},{"n":"Public Address System","a":"نظام نداء عام","x":"مكبرات صوت لتوجيه مستخدمي النفق وقت الطوارئ.","d":"Loudspeaker system of a tunnel used to give instructions to users in an emergency."},{"n":"Tunnel Bore","a":"أنبوب النفق","x":"أنبوب النفق الذي يحمل حركة اتجاه واحد.","d":"Tube of a tunnel that carries the traffic of one direction."},{"n":"Tunnel Drainage and Sump System","a":"نظام ضخ وتصريف النفق","x":"نظام يجمع الماء والانسكابات داخل النفق ويضخها للخارج.","d":"System that collects water, spills and firefighting water inside a tunnel and pumps it out."},{"n":"Tunnel Emergency Exits","a":"مخارج طوارئ النفق","x":"مخرج يهرب منه الناس إلى مكان آمن عند الحريق أو الحادث.","d":"Emergency exit of a tunnel that lets users escape to a safe place in case of fire or accident."},{"n":"Tunnel Firefighting System","a":"نظام مكافحة حريق النفق","x":"تجهيزات إطفاء الحريق داخل النفق.","d":"Firefighting installation of a tunnel (water supply, hydrants, hose and extinguisher cabinets).","ch":[{"n":"Smoke & Fire Detectors","a":"كواشف دخان وحريق","x":"أجهزة تكشف الدخان أو الحريق وتطلق الإنذار.","d":"Detectors installed in a tunnel that detect smoke or fire and raise an alarm."},{"n":"Tunnel Firefighting Equipment","a":"معدات مكافحة الحريق في النفق","x":"حنفيات وخراطيم وطفايات الحريق داخل النفق.","d":"Fire hydrant, hose cabinet or extinguisher cabinet installed in a tunnel."}]},{"n":"Tunnel Lighting System","a":"نظام إنارة النفق","x":"إنارة النفق التي تتكيف مع ضوء النهار وحركة المرور.","d":"Lighting installation of a tunnel that adapts the light level to traffic and daylight conditions."},{"n":"Tunnel Lining","a":"بطانة النفق","x":"البطانة الداخلية التي تسند الأرض وتشكّل سطح النفق.","d":"Inner structural lining of a tunnel that supports the ground and provides the finished tunnel surface."},{"n":"Tunnel Portal","a":"بوابة النفق","x":"منشأة المدخل عند كل طرف من النفق.","d":"Entrance structure at each end of a tunnel."},{"n":"Tunnel SCADA and Control System","a":"نظام تحكم ومراقبة النفق","x":"نظام يراقب كل معدات النفق ويشغّلها من غرفة التحكم.","d":"Control and monitoring system that supervises and operates all tunnel equipment from the control room.","ch":[{"n":"Tunnel Remote Terminal Unit","a":"مواقع لوحات الانفاق-إسكادا","x":"وحدة تجمع إشارات معدات النفق وترسلها لنظام التحكم.","d":"Remote Terminal Unit installed in a tunnel that collects the signals of the tunnel equipment (ventilation, lighting, fire and safety systems) and transmits them to the tunnel control system."}]},{"n":"Tunnel Ventilation System","a":"نظام تهوية النفق","x":"مراوح تزوّد النفق بالهواء النقي وتتحكم في الدخان.","d":"System of fans that supplies fresh air to a tunnel and controls smoke in case of fire.","ch":[{"n":"Tunnel Jet Fans","a":"مراوح النفق","x":"مروحة نفاثة تهوّي النفق وتطرد الدخان.","d":"Jet fan installed in a tunnel that ventilates it and controls smoke in case of fire."}]}]},{"n":"Underpass","a":"نفق سفلي","x":"نفق قصير يمرر طريقًا تحت طريق آخر أو سكة حديد.","d":"Short tunnel that carries a road under another road or railway."}]},{"n":"Drainage","a":"تصريف المياه","ch":[{"n":"Detention Basin","a":"حوض تجميع","x":"حوض يخزّن ماء المطر مؤقتًا ثم يصرفه ببطء.","d":"Basin that stores storm water temporarily and releases it slowly to reduce flooding downstream."},{"n":"Erosion Protection","a":"حماية من النحر","x":"تكسية تحمي الميول والقنوات من الجرف.","d":"Protection (for example riprap, lining or vegetation) that prevents the erosion of slopes, channels and outfalls."},{"n":"Infiltration Trench","a":"قناة تسريب","x":"خندق مملوء بمواد نفّاذة يسرّب ماء المطر إلى الأرض.","d":"Trench filled with permeable material that lets storm water soak into the ground."},{"n":"Inlet","a":"فتحة تصريف","x":"فتحة على حافة الطريق يدخل منها الماء إلى شبكة التصريف.","d":"Opening at the road edge or in the gutter through which surface water enters the stormwater drainage network.","ch":[{"n":"Drainage Grate","a":"غطاء أو شبكة تصريف","x":"شبك يغطي فتحة التصريف ويمنع دخول المخلفات.","d":"Grating that covers a drainage inlet or manhole and lets surface water in while keeping debris out."}]},{"n":"Manhole","a":"غرفة تفتيش","x":"غرفة للوصول إلى أنابيب التصريف وتنظيفها.","d":"Access chamber of the stormwater drainage network that allows inspection and cleaning of the pipes."},{"n":"Oil Separator","a":"فاصل زيوت","x":"وحدة تفصل الزيوت والوقود عن ماء الطريق قبل صرفه.","d":"Unit that separates oil and fuel from road runoff before it is discharged."},{"n":"Open Channel","a":"قناة مفتوحة","x":"قناة مكشوفة تنقل ماء المطر بعيدًا عن الطريق.","d":"Open drainage channel that carries storm water away from the road."},{"n":"Outfall","a":"نقطة تصريف نهائية","x":"النقطة التي يصب فيها تصريف الطريق في مجرى أو منطقة استقبال.","d":"Point where a road drainage system discharges into a watercourse or receiving area."},{"n":"Pump Station","a":"محطة ضخ","x":"مضخات ترفع ماء المطر حيث لا يكفي الانحدار الطبيعي.","d":"Station with pumps that lifts and discharges storm water where gravity drainage is not possible (for example at underpasses)."},{"n":"Retention Basin","a":"حوض احتجاز","x":"حوض يحتفظ بماء المطر حتى يتسرب أو يتبخر.","d":"Basin that holds storm water permanently, letting it infiltrate or evaporate."},{"n":"Sediment Trap","a":"مصيدة رواسب","x":"منشأة تحجز الرواسب قبل وصولها إلى شبكة التصريف.","d":"Structure that captures sediment carried by storm water before it reaches the drainage system or outfall."},{"n":"Side Ditch","a":"قناة تصريف جانبية","x":"خندق مكشوف على جانب الطريق يجمع الماء ويبعده.","d":"Open ditch along the side of the road that collects and carries surface water away from the road."},{"n":"Stormwater Pipe","a":"ماسورة تصريف","x":"أنبوب مدفون ينقل ماء المطر إلى نقطة الصرف.","d":"Underground pipe that carries storm water from inlets and manholes to an outfall."}]},{"n":"Geotechnical","a":"الأعمال الجيوتقنية","ch":[{"n":"Cutting","a":"قطع صخري أو ترابي","x":"حفر في أرض مرتفعة يمر فيه الطريق تحت مستوى الأرض.","d":"Excavation through higher ground in which the road is built below the natural ground level."},{"n":"Earthwork","a":"الحفر والردم","x":"منطقة حُفرت أو رُدمت لتشكيل جسم الطريق.","d":"Area of the road corridor where the ground has been excavated (cut) or built up (fill) to form the road."},{"n":"Embankment","a":"جسر ترابي","x":"ردم ترابي مرتفع يُبنى عليه الطريق.","d":"Raised earth structure on which the road is built above the natural ground."},{"n":"Gabion Wall","a":"جدار سلال حجرية","x":"جدار ساند من سلال سلكية مملوءة بالحجارة.","d":"Retaining wall made of stone-filled wire baskets."},{"n":"Geotechnical Monitoring Instrument","a":"جهاز رصد جيوتقني","x":"جهاز يقيس حركة الميول والجدران أو ضغط الماء فيها.","d":"Instrument that measures the movement, water pressure or deformation of slopes, embankments and walls (for example an inclinometer or piezometer)."},{"n":"Ground Anchor System","a":"نظام المراسي الأرضية","x":"مجموعة مراسٍ تثبّت ميلًا أو جدارًا بربطه بأرض ثابتة.","d":"System of ground anchors that stabilises a slope, wall or structure by tying it to stable ground.","ch":[{"n":"Ground Anchor","a":"مرساة أرضية","x":"وتر مثبّت في أرض ثابتة يشدّ الميل أو الجدار.","d":"Single tendon anchored in stable ground that transfers tension forces from a slope or wall."}]},{"n":"Rockfall Protection","a":"حماية من تساقط الصخور","x":"منظومة تحمي الطريق من الصخور الساقطة.","d":"System that protects the road from falling rocks on rock slopes (for example meshes, barriers, bolts, shotcrete).","ch":[{"n":"Rock Bolts","a":"مسامير تثبيت صخري","x":"مسامير فولاذية تثبّت الكتل الصخرية المفككة.","d":"Steel bolts anchored into a rock slope that stabilise loose rock blocks."},{"n":"Rockfall Barrier","a":"حاجز تساقط صخور","x":"حاجز يوقف الصخور قبل وصولها إلى الطريق.","d":"Flexible or rigid barrier that stops falling rocks before they reach the road."},{"n":"Rockfall Mesh","a":"شبكة حماية صخرية","x":"شبكة سلكية تمسك الصخور المفككة في مكانها.","d":"Wire mesh draped or anchored on a rock slope that holds loose rock in place."},{"n":"Shotcrete Protection","a":"خرسانة مرشوشة","x":"طبقة خرسانة مرشوشة تحمي الميل من التعرية.","d":"Sprayed concrete layer on a rock or soil slope that protects it from weathering and erosion."}]},{"n":"Slope","a":"منحدر","x":"سطح مائل بجانب الطريق يُراقَب لضمان ثباته.","d":"Inclined ground surface along the road (natural or engineered) that is monitored and maintained for stability."},{"n":"Soil Nailing System","a":"نظام تدعيم بالمسامير الترابية","x":"قضبان فولاذية تُغرس في الميل الترابي لتقويته.","d":"System of steel bars (nails) installed into a soil slope or excavation to reinforce and stabilise it."}]},{"n":"Traffic Control","a":"التحكم المروري","ch":[{"n":"Blinkers","a":"أضواء وامضة","x":"ضوء وامض ينبّه السائقين إلى خطر.","d":"Flashing warning light installed at the roadside or on a sign to warn drivers of a hazard (for example a sharp curve, junction or obstacle)."},{"n":"Delineator","a":"محدد مسار","x":"عمود عاكس على حافة الطريق يبيّن مساره ليلًا.","d":"Reflective post or marker along the road edge that shows the alignment of the road, especially at night."},{"n":"Hazard Marker","a":"علامة خطر","x":"علامة تحذير توضع عند العوائق الثابتة.","d":"Warning marker placed at fixed obstacles on or next to the road (for example bridge piers, abutments or island noses) to alert drivers to the obstacle."},{"n":"Pavement Arrow","a":"سهم أرضي","x":"سهم مرسوم على سطح الطريق يبيّن اتجاه السير.","d":"Arrow marked on the road surface that shows the permitted direction of travel in a lane."},{"n":"Pavement Text","a":"نص أرضي","x":"كلمة أو رقم مكتوب على سطح الطريق مثل «قف».","d":"Word or number marked on the road surface (for example STOP or a speed value)."},{"n":"Raised Pavement Marker","a":"عين القط / العاكس الأرضي","x":"عاكس مثبت على سطح الطريق يحدد الحارات ليلًا.","d":"Road stud or reflector fixed on the road surface that marks lanes and edges and reflects vehicle lights at night."},{"n":"Road Marking","a":"علامة أرضية","x":"خطوط ورموز مدهونة على الطريق تنظّم الحركة.","d":"Lines, symbols and words painted or applied on the road surface that guide and regulate traffic."},{"n":"Road Marking Area","a":"علامة طريق مساحية","x":"علامة تغطي مساحة، مثل التهشير والمربعات.","d":"Road marking that covers an area, such as hatching, chevrons, onditions (temperature, wind, visibility, precipitation).","ch":[{"n":"Road Surface Ice Sensor","a":"حساس تجمد السطح","x":"حساس في سطح الطريق يكشف الجليد أو الماء.","d":"Sensor embedded in the road surface that measures the surface temperature and detects ice or water."}]},{"n":"Roadside Unit","a":"وحدة جانب الطريق","x":"وحدة تتبادل المعلومات بين الطريق والمركبات المتصلة.","d":"Roadside communication unit that exchanges information between the road infrastructure and connected vehicles."},{"n":"Router","a":"الموجّه الشبكي","x":"جهاز يربط الكاميرات واللوحات بمركز التحكم.","d":"Network router of the ITS field network that connects cameras, signs and other devices to the control centre."},{"n":"Saher Camera","a":"كاميرات ساهر","x":"كاميرا نظام ساهر لرصد المخالفات المرورية آليًا.","d":"Automated traffic enforcement camera of the Saher system that detects and records traffic violations such as speeding or red-light running.","ch":[{"n":"Camera Sensor","a":"حساس الكاميرا","x":"وحدة الاستشعار التي تقيس السرعة أو تكشف المخالفة.","d":"Sensor unit of a Saher enforcement camera that detects the speed or violation of passing vehicles."}]},{"n":"Sensor","a":"حساس","x":"حساس ميداني: مروري أو رادار أو رؤية أو طقس.","d":"Field sensor installed on the road network, such as a traffic, radar, Bluetooth, visibility or weather sensor."},{"n":"Speed Enforcement Camera","a":"كاميرا رصد السرعة","x":"كاميرا ترصد المركبات المتجاوزة للسرعة.","d":"Camera that detects and records vehicles exceeding the speed limit."},{"n":"Static Weigh Station","a":"محطة وزن ثابتة","x":"محطة دائمة توزن فيها الشاحنات وهي واقفة.","d":"Permanent weigh station where trucks are weighed while stationary."},{"n":"Traffic Camera","a":"كاميرا مرورية","x":"كاميرا لمتابعة حالة المرور والحوادث من مركز التحكم.","d":"CCTV camera used to watch traffic conditions and incidents from the control centre."},{"n":"Traffic Counting Station","a":"محطة العد المروري","x":"محطة دائمة تعدّ المركبات المارة وتصنّفها.","d":"Permanent statio  الإدارة الديناميكية للحارات","x":"نظام يفتح الحارات ويغلقها حسب حالة المرور.","d":"System that opens and closes lanes and controls lane use dynamically through lane control signals."},{"n":"Ramp Metering System","a":"نظام التحكم في مداخل الطرق","x":"نظام ينظّم تدفق المركبات الداخلة من المداخل.","d":"System of ramp meters that controls the flow of vehicles entering the main road from the ramps."},{"n":"Weight Enforcement System","a":"نظام ضبط الأوزان","x":"منظومة معدات ومواقع لضبط أوزان الشاحنات وأبعادها.","d":"System of weighing equipment and facilities used to enforce the vehicle weight and dimension limits on the road."}]},{"n":"Lighting, Electrical & Communications","a":"الإنارة والكهرباء والاتصالات","ch":[{"n":"Communication Room","a":"غرفة اتصالات","x":"غرفة تحوي معدات الاتصالات وتوزيع الألياف.","d":"Room that houses communication equipment and the distribution cabinet of the fibre network.","ch":[{"n":"Fiber Distribution Cabinet","a":"صندوق توزيع ألياف","x":"صندوق تُوصَّل فيه كابلات الألياف بمعدات الطريق.","d":"Cabinet where fibre-optic cables are terminated and connected to roadside equipment."}]},{"n":"Duct Bank","a":"مسار دكتات","x":"مجموعة مواسير مدفونة تمر فيها الكابلات.","d":"Group of underground ducts that carry the power and communication cables along the road."},{"n":"Electrical Cabinet","a":"لوحة كهربائية","x":"خزانة توزّع الكهرباء على إنارة الطريق وأجهزته.","d":"Cabinet that houses the electrical distribution equipment that supplies road lighting and roadside devices.","ch":[{"n":"Cabinet Cooling Unit","a":"وحدة تبريد الخزانة","x":"وحدة تبريد تحافظ على حرارة معدات الخزانة.","d":"Cooling unit of a cabinet that keeps the equipment within its operating temperature."}]},{"n":"Electrical Cable","a":"كابل كهربائي","x":"كابل يغذي الإنارة وأجهزة الطريق بالكهرباء.","d":"Power cable that supplies electricity to road lighting and roadside equipment."},{"n":"Electrical Meter","a":"عداد كهربائي","x":"عداد يقيس استهلاك الكهرباء.","d":"Meter that measures the electricity consumed by road lighting and roadside equipment."},{"n":"Electrical Substation","a":"محطة كهرباء فرعية","x":"محطة تستقبل الكهرباء وتوزعها على شبكة الطريق.","d":"Substation that receives power from the utility and distributes it to the road electrical system."},{"n":"Feeder Pillar","a":"لوحة توزيع مغذيات","x":"خزانة شارع تتفرع منها دوائر الإنارة.","d":"Street cabinet from which electrical circuits are distributed to road lighting and roadside equipment."},{"n":"Fiber Optic Cable","a":"كابل ألياف بصرية","x":"كابل ينقل بيانات شبكة اتصالات الطريق.","d":"Fibre-optic cable that carries the data of the road communication network."},{"n":"Generator","a":"مولد كهربائي","x":"مولد احتياطي يعمل عند انقطاع التيار.","d":"Standby generator that supplies power to road equipment when the mains supply fails."},{"n":"Handhole","a":"غرفة سحب كابلات","x":"غرفة صغيرة مدفونة لسحب الكابلات وصيانتها.","d":"Small underground chamber that gives access to cables and ducts for pulling and maintenance."},{"n":"High Mast","a":"برج إنارة عالٍ","x":"برج إنارة عالٍ يضيء مساحة واسعة مثل التقاطعات.","d":"Tall lighting mast with several luminaires that lights a large area such as an interchange."},{"n":"Lighting Pole","a":"عمود إنارة","x":"عمود يحمل كشافات إنارة الطريق.","d":"Pole that carries road lighting luminaires.","ch":[{"n":"Lighting Arm","a":"ذراع إنارة","x":"ذراع يمدّ الكشاف فوق الطريق.","d":"Arm (bracket) that holds a luminaire away from the pole over the road."},{"n":"Luminaire","a":"وحدة إنارة","x":"الكشاف الذي يضيء الطريق.","d":"Light fitting mounted on a pole, mast or structure that lights the road."}]},{"n":"Lightning Protection","a":"مانع صواعق","x":"تجهيز يحمي المنشآت والمعدات من الصواعق.","d":"Installation that protects structures and equipment from lightning strikes."},{"n":"Network Switch","a":"محوّل الشبكة","x":"جهاز يربط أجهزة شبكة الاتصالات ببعضها.","d":"Network switch of the ITS communication network, installed in a cabinet or communication room."},{"n":"Solar Power Unit","a":"وحدة طاقة شمسية","x":"وحدة تغذي معدات الطريق من الألواح الشمسية والبطاريات.","d":"Unit that supplies power to roadside equipment from solar panels and batteries.","ch":[{"n":"Battery","a":"بطارية","x":"بطارية تخزّن الكهرباء لمعدات الطريق.","d":"Battery that stores electrical energy for roadside equipment."},{"n":"Solar Panel","a":"لوح شمسي","x":"لوح يحوّل ضوء الشمس إلى كهرباء.","d":"Photovoltaic panel that converts sunlight into electricity for roadside equipment."}]},{"n":"Transformer","a":"محول كهربائي","x":"محول يغيّر جهد الكهرباء ليناسب الإنارة والأجهزة.","d":"Transformer that changes the supply voltage for road lighting and roadside equipment."},{"n":"UPS","a":"وحدة عدم انقطاع الكهرباء","x":"وحدة تُبقي المعدات المهمة تعمل عند انقطاع التيار.","d":"Uninterruptible power supply that keeps critical roadside equipment running during a power failure."},{"n":"Earthing System","a":"نظام تأريض","x":"نظام يحمي الناس والمعدات من الأعطال الكهربائية.","d":"Earthing (grounding) system that protects people and equipment from electrical faults."},{"n":"Electrical Circuit","a":"الدائرة الكهربائية","x":"دائرة كهربائية تغذي مجموعة كشافات وأجهزة.","d":"Electrical circuit fed from a feeder pillar or cabinet that supplies luminaires and devices through its cables."}]},{"n":"Facilities, Road Furniture & Mobility","a":"المرافق وأثاث الطريق والتنقل","ch":[{"n":"Access Gates","a":"بوابات دخول وصيانة","x":"بوابة تتحكم في الدخول إلى جزء من الطريق أو مرفق.","d":"Gate that controls access to a road section, median opening or facility.","ch":[{"n":"Gate Hinge and Hardware","a":"مفصلات ومعدّات البوابة","x":"المفصلات والتجهيزات التي تتحرك عليها البوابة.","d":"Hinges and fittings on which a gate leaf moves."},{"n":"Gate Leaf","a":"ضلفة البوابة","x":"الجزء المتحرك من البوابة.","d":"Moving leaf (panel) of a gate."},{"n":"Gate Lock","a":"قفل أو مشغل البوابة","x":"قفل البوابة.","d":"Lock of a gate."},{"n":"Gate Post","a":"عمود أو أساس البوابة","x":"العمود الذي يحمل ضلفة البوابة.","d":"Post that carries a gate leaf."}]},{"n":"Accessibility Ramp","a":"منحدر إتاحة","x":"منحدر يسهّل انتقال الكراسي المتحركة بين الرصيف والطريق.","d":"Ramp that lets wheelchair users and people with prams move between the sidewalk and the carriageway."},{"n":"Benches","a":"مقاعد انتظار","x":"مقعد للجلوس على جانب الطريق أو في مرفق.","d":"Bench installed along the road or at a facility for people to sit.","ch":[{"n":"Bench Frame","a":"هيكل أو أساس المقعد","x":"الهيكل الذي يحمل المقعد.","d":"Frame that supports a bench."},{"n":"Bench Seat and Backrest","a":"مقعد وظهر المقعد","x":"قاعدة الجلوس وظهر المقعد.","d":"Seat and backrest of a bench."}]},{"n":"Bollards","a":"أعمدة قصيرة","x":"عمود قصير يمنع دخول المركبات أو يحمي المشاة.","d":"Short post along the road that controls vehicle access or protects pedestrians and structures (street, traffic, parking, removable or illuminated bollard)."},{"n":"Bus Stop","a":"موقف حافلات","x":"مكان تقف فيه الحافلات لصعود الركاب ونزولهم.","d":"Place along the road where buses stop to pick up and drop off passengers.","ch":[{"n":"Bus Bay","a":"جيب حافلات","x":"جيب بجانب الطريق تقف فيه الحافلة خارج الحارة.","d":"Recessed area next to the carriageway where buses stop outside the traffic lane."},{"n":"Passenger Waiting Area","a":"منطقة انتظار ركاب","x":"مكان انتظار الركاب في الموقف.","d":"Area of a bus stop where passengers wait."}]},{"n":"Cycle Track","a":"مسار دراجات منفصل","x":"مسار للدراجات مفصول عن حركة المركبات.","d":"Path for bicycles that is physically separated from the carriageway."},{"n":"Decorative Road Furniture","a":"أثاث تجميلي","x":"عنصر تجميلي مثل أحواض الزرع.","d":"Decorative element of the road environment (for example planters or ornamental features)."},{"n":"Emergency Point","a":"نقطة إسعاف أو طوارئ","x":"نقطة يطلب منها مستخدم الطريق المساعدة.","d":"Point along the road where road users can call for help or find emergency equipment."},{"n":"Emergency Telephone","a":"هاتف طوارئ","x":"هاتف موصول بمركز التحكم لمكالمات الطوارئ.","d":"Telephone along the road connected to the control centre for emergency calls."},{"n":"Fountain & Water Feature","a":"نافورة","x":"نافورة أو عنصر مائي تجميلي داخل حرم الطريق.","d":"Decorative fountain or water feature within the road right-of-way, for example at a roundabout or landscaped area."},{"n":"Fuel Station","a":"محطة وقود","x":"محطة وقود على الطريق.","d":"Fuel station located along the road and accessed from it."},{"n":"Gateway Treatment","a":"بوابة تهدئة","x":"معالم عند مدخل بلدة تنبّه السائق ليخفف السرعة.","d":"Set of features (signs, markings, landscaping, narrowing) at the entrance of a town or zone that tells drivers to slow down."},{"n":"Inspection Checkpoint","a":"نقطة تفتيش","x":"نقطة توقَف فيها المركبات للتفتيش.","d":"Checkpoint on the road where vehicles are stopped for inspection."},{"n":"Litter Bins","a":"سلال نفايات","x":"سلة للنفايات.","d":"Bin for litter along the road or at a facility."},{"n":"Maintenance Depot","a":"مستودع الصيانة","x":"ساحة ومستودع أعمال صيانة الطريق.","d":"Road maintenance depot or yard of RGA or its contractors."},{"n":"On-Street Parking Bays","a":"مواقف طولية","x":"مواقف مخططة بمحاذاة الطريق.","d":"Marked parking spaces along the carriageway."},{"n":"Parking Bollards","a":"أعمدة مواقف قصيرة","x":"عمود قصير يمنع الوقوف في منطقة.","d":"Bollard that controls or prevents parking in an area."},{"n":"Parking Meter","a":"عداد مواقف","x":"جهاز تحصيل رسوم الوقوف.","d":"Machine that collects payment for on-street parking."},{"n":"Pathway","a":"ممر المشاة","x":"ممر للمشاة مفصول عن حركة المركبات.","d":"Path within the road corridor used by pedestrians or for access, separate from the carriageway."},{"n":"Pedestrian Area","a":"منطقة للمشاة","x":"مساحة مخصصة للمشاة مثل الساحات.","d":"Area within the road right-of-way reserved for pedestrians (for example a plaza or pedestrian zone)."},{"n":"Pedestrian Crossing","a":"معبر مشاة","x":"مكان مخطط يعبر منه المشاة الطريق.","d":"Marked place where pedestrians cross the carriageway."},{"n":"Pedestrian Railings","a":"سلاسل أو درابزين مشاة","x":"درابزين يوجّه المشاة ويبعدهم عن المركبات.","d":"Railing that guides pedestrians and keeps them away from traffic."},{"n":"Rest Area","a":"منطقة استراحة","x":"مكان يتوقف فيه المسافرون للراحة.","d":"Area where road users can stop and rest."},{"n":"Road Parking","a":"المواقف","x":"مساحة مخصصة لوقوف المركبات.","d":"Area along or next to the road designated for parking vehicles."},{"n":"School Beacon","a":"وميض منطقة مدرسة","x":"ضوء وامض ينبّه إلى منطقة مدرسة وقت الدوام.","d":"Flashing beacon that warns drivers of a school zone during school hours."},{"n":"Service Area","a":"منطقة خدمات","x":"منطقة تقدم الوقود والطعام والراحة والصلاة للمسافرين.","d":"Area along the road that offers services to road users (fuel, food, rest, prayer, toilets).","ch":[{"n":"EV Charging Station","a":"نقطة شحن مركبات كهربائية","x":"نقطة شحن للمركبات الكهربائية.","d":"Charging station for electric vehicles."},{"n":"Internal Walkways","a":"أرصفة داخلية","x":"ممر مشاة داخل منطقة الخدمات.","d":"Pedestrian walkway inside a service area."},{"n":"Parking Shade Structures","a":"مظلات مواقف","x":"مظلة فوق مواقف المركبات.","d":"Shade structure over parking spaces."},{"n":"Prayer Area","a":"منطقة صلاة","x":"مصلى منطقة الخدمات.","d":"Prayer facility (musalla) of a service area."},{"n":"Toilets","a":"دورات مياه","x":"دورات مياه عامة.","d":"Public toilet facility of a service area."},{"n":"Water Tanks","a":"خزانات مياه","x":"خزان ماء للمنطقة.","d":"Water storage tank of a service area or facility."}]},{"n":"Shelters","a":"مظلات انتظار","x":"مظلة تحمي المنتظرين من الشمس والمطر.","d":"Shelter that protects waiting people from sun and weather (for example at a bus stop).","ch":[{"n":"Shelter Bench","a":"مقعد المظلة","x":"مقعد داخل المظلة.","d":"Bench inside a shelter."},{"n":"Shelter Frame","a":"هيكل المظلة","x":"الهيكل الإنشائي للمظلة.","d":"Structural frame of a shelter."},{"n":"Shelter Lighting Unit","a":"وحدة إنارة المظلة","x":"إنارة المظلة.","d":"Lighting unit of a shelter."},{"n":"Shelter Roof","a":"سقف المظلة","x":"سقف المظلة.","d":"Roof of a shelter."},{"n":"Shelter Side Panels","a":"ألواح جانبية للمظلة","x":"لوح جانبي للمظلة.","d":"Side panel of a shelter."}]},{"n":"Sidewalk","a":"رصيف مشاة","x":"ممر مرصوف للمشاة بمحاذاة الطريق.","d":"Paved path along the road for pedestrians."},{"n":"Speed Cushion","a":"وسادة تهدئة","x":"وسادة مرتفعة تهدّئ السيارات وتسمح بمرور المركبات العريضة.","d":"Raised cushion in the lane that slows down cars while letting wider vehicles pass."},{"n":"Speed Hump","a":"مطب صناعي","x":"مطب يهدّئ سرعة المركبات.","d":"Raised hump across the carriageway that slows down traffic."},{"n":"Statue & Monument","a":"تمثال","x":"تمثال أو نصب داخل حرم الطريق.","d":"Statue, sculpture or monument located within the road right-of-way, for example on a roundabout or median."},{"n":"Tactile Paving","a":"سطح ملموس للمكفوفين","x":"بلاط بارز يرشد المكفوفين وينبّههم إلى المعابر.","d":"Textured paving that guides visually impaired pedestrians and warns them of crossings and hazards."},{"n":"Taxi Station","a":"محطة سيارات الأجرة","x":"مكان مخصص لانتظار سيارات الأجرة.","d":"Area along the road designated for taxis to wait and pick up passengers."}]},{"n":"Environment, Weather & Railway","a":"البيئة والطقس والسكك الحديدية","ch":[{"n":"Dune Stabilization Barrier","a":"حاجز تثبيت كثبان","x":"حاجز يثبّت الكثبان الرملية ويمنع زحفها على الطريق.","d":"Barrier that stabilises sand dunes and stops them from moving onto the road."},{"n":"Landscaping","a":"تنسيق موقع","x":"مساحة مزروعة داخل حرم الطريق.","d":"Planted or landscaped area within the road right-of-way."},{"n":"Railway Grade Crossing","a":"معبر سكة حديد","x":"مكان يتقاطع فيه الطريق مع السكة على نفس المستوى.","d":"Place where the road crosses a railway at the same level.","ch":[{"n":"Crossing Gate","a":"بوابة عبور","x":"ذراع يغلق الطريق عند اقتراب القطار.","d":"Barrier gate that closes the road when a train approaches a grade crossing."},{"n":"Crossing Surface","a":"سطح المعبر","x":"سطح الطريق فوق قضبان السكة.","d":"Road surface across the rails of a railway grade crossing."},{"n":"Flashing Lights","a":"أضواء عبور","x":"أضواء وامضة تحذّر من اقتراب القطار.","d":"Flashing lights that warn road users of an approaching train at a grade crossing."},{"n":"Train Detection Interface","a":"واجهة كشف قطار","x":"ربط مع نظام السكة يكشف القطار ويشغّل التحذير.","d":"Interface with the railway system that detects approaching trains and activates the crossing warnings."},{"n":"Warning Bell","a":"جرس تحذير","x":"جرس يحذّر من اقتراب القطار.","d":"Bell that warns road users of an approaching train at a grade crossing."}]},{"n":"Road Irrigation Structure","a":"نقاط خطوط الري","x":"منشأة من نظام الري مثل غرفة الصمامات.","d":"Structure of the irrigation system that waters the road landscaping (for example a valve chamber or irrigation point)."},{"n":"Trees","a":"أشجار","x":"شجرة داخل حرم الطريق.","d":"Tree within the road right-of-way."},{"n":"Wadi Crossing","a":"معبر وادي","x":"مكان يقطع فيه الطريق واديًا قد يجري بعد المطر.","d":"Place where the road crosses a wadi (seasonal watercourse) and may be flooded after rain."},{"n":"Water Level Gauge","a":"مقياس منسوب مياه","x":"مقياس لارتفاع الماء عند معبر أو قناة.","d":"Gauge that measures the water level at a crossing or channel."},{"n":"Wildlife Crossing","a":"معبر حياة فطرية","x":"منشأة تسمح للحيوانات بعبور الطريق بأمان.","d":"Structure (overpass, underpass or fenced crossing) that lets animals cross the road safely."},{"n":"Wind Breaks","a":"مصدات رياح","x":"سياج أو زرع يخفف الرياح والرمال الزاحفة.","d":"Barrier (fence or planting) that reduces wind and blowing sand reaching the road."},{"n":"Dust Storm Warning System","a":"نظام تحذير عواصف رملية","x":"نظام يكشف العواصف الرملية ويحذّر السائقين.","d":"System that detects dust storms and warns drivers by signs or messages."},{"n":"Flood Warning System","a":"نظام تحذير سيول","x":"نظام يكشف السيول ويحذّر مستخدمي الطريق.","d":"System that detects flooding (for example at wadi crossings) and warns road users."},{"n":"Irrigation System","a":"نظام ري","x":"شبكة تروي مزروعات الطريق.","d":"Irrigation system that waters the road landscaping.","ch":[{"n":"Irrigation Controller","a":"وحدة تحكم ري","x":"وحدة تبرمج مواعيد الري وتشغّله.","d":"Controller that schedules and runs the irrigation."},{"n":"Irrigation Pipe","a":"أنبوب ري","x":"أنبوب من شبكة الري.","d":"Pipe of the irrigation system."},{"n":"Irrigation Valve","a":"صمام ري","x":"صمام يتحكم في تدفق ماء الري.","d":"Valve that controls the water flow in the irrigation system."}]}]},{"n":"Road Network","a":"شبكة الطرق","ch":[{"n":"Access Road","a":"طريق ربط","x":"طريق يوصل من الطريق الرئيسي إلى العقارات والمرافق.","d":"Road that gives access from the main road to adjacent properties or facilities."},{"n":"Advertisement Board","a":"لوحة إعلانات","x":"لوحة إعلانية داخل حرم الطريق أو بجواره.","d":"Advertising sign or billboard installed within or next to the road right-of-way."},{"n":"Boundary Marker","a":"علامة حد","x":"علامة تبيّن أين ينتهي حرم الطريق.","d":"Marker installed on the right-of-way boundary to show where the road land ends.","ch":[{"n":"Boundary Marker Plate","a":"لوحة أو غطاء علامة الحد","x":"لوحة التعريف المثبتة على علامة الحد.","d":"Plate of a boundary marker that carries its identification."},{"n":"Boundary Marker Post","a":"عمود علامة الحد","x":"العمود الذي يثبّت علامة الحد في الأرض.","d":"Post of a boundary marker that holds it in the ground."}]},{"n":"Curb","a":"البردورة","x":"حافة مرتفعة تفصل الحارات عما بجوارها.","d":"Raised edge along the carriageway, median or island that separates the traffic lanes from the adjacent area and guides drainage."},{"n":"Emergency Stopping Area","a":"منطقة التوقف الطارئ","x":"مساحة بجانب الطريق للتوقف الآمن عند العطل.","d":"Area next to the carriageway where a vehicle can stop safely in an emergency or breakdown."},{"n":"Facility Gate","a":"بوابة منشأة","x":"بوابة تتحكم في الدخول من الطريق إلى منشأة.","d":"Gate that function wither(gone,cp){tree.querySelectorAll('.rl').forEach(r=>{if(+r.dataset.lv>cp)r.remove();});if(!anim||!gone.length)return 0;const items=gone.flatMap(el=>[...el.querySelectorAll('.node')]);
  gsap.to(items,{autoAlpha:0,scale:.2,rotation:LANG==='ar'?-50:50,duration:.26,ease:'power2.in',stagger:{amount:Math.min(.22,items.length*.02),from:'end'}});

    for(let i=cp+1;i<=np.length;i++){if(!np[i-1].kids.length)break;let el=tree.querySelector(`.level:not(.out)[data-i="${i}"]`);if(!el){el=levelEl(i);tree.appendChild(el);marks();seat(el);el.querySelectorAll('.node').forEach(wire);}}

tree.addEventListener('click',e=>{const pb=e.target.closest('.pop button');if(pb){hidePop();return;}

    if(anim)gsap.fromTo(b,{scale:1.3},{scale:1,duration:1,delay:.35,ease:'elastic.out(1,0.4)',clearProps:'transform'});if(!n.kids.length)setTimeout(()=>showPop(n),still?0:500);return;}

/* the whole tree at once: every level in its own column, each parent level with its first child */

    n.kids.forEach(k=>{const ky=k._y+k._h/2,kx=rtl?k._x+k._w:k._x,d=Math.abs(ky-cy)<1?`M${sx} ${cy}H${kx}`:rpath([[sx,cy],[tx,cy],[tx,ky],[kx,ky]],11);

$('#all').addEventListener('click',()=>{if(busy)return;FULL=!FULL;setZoom(innerWidth<=640?(FULL?.6:.8):1);const top=$('#board').getBoundingClientRect().top;start();$('#board').scrollLeft=0;if(top<0)scrollBy({top:top-12});});

function zl(){const u=LANG==='ar'?['تصغير','تكبير','الحجم الأصلي',FS?'خروج من ملء الشاشة':'ملء الشاشة']:['Zoom out','Zoom in','Reset zoom',FS?'Exit full screen':'Full screen'];document.querySelectorAll('#zoom button').forEach((b,i)=>{b.title=u[i];b.setAttribute('aria-label',u[i]);});}
/* switching language turns the whole page over like a leaf of a book */

  const done=()=>{el.style.transformOrigin='';page.classList.remove('turn');turning=false;};
  el.style.transformOrigin=(s>0?'0% ':'100% ')+oy;
  const out=el.animate([{transform:P+'rotateY(0deg)',opacity:1},{transform:P+`rotateY(${-88*s}deg)`,opacity:.25}],{duration:430,easing:'cubic-bezier(.5,0,.9,.5)',fill:'forwards'});

/* light and dark */
const page=document.documentElement;
function paintMode(){const m=page.getAttribute('data-mode');$('#theme').classList.toggle('is-dark',m==='dark');document.querySelectorAll('#theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));}

$('#theme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const next=b.dataset.mode;if(next===page.getAttribute('data-mode'))return;

  t.finished.finally(()=>page.removeAttribute('data-shrinking'));});
